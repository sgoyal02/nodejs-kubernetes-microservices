apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nodejs-kubernetes-microservices-ingress
  namespace: nodejs-kubernetes-microservices
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/jobs
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000
