apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nodejs-kubernetes-microservices-ingress
  namespace: nodejs-kubernetes-microservices
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /(submit|status)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000
