services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - '6379:6379'
    env_file:
      - ./env/.env.redis
    volumes:
      - redis-data:/data

  api-gateway:
    build:
      context: ..
      dockerfile: apps/api-gateway/Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - ./env/.env.api-gateway
    depends_on:
      - redis
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/apps/api-gateway/node_modules
      - /app/packages/shared/node_modules
    command: pnpm --filter @nodejs-kubernetes-microservices/api-gateway dev

  job-worker:
    build:
      context: ..
      dockerfile: apps/job-worker/Dockerfile
    env_file:
      - ./env/.env.job-worker
    depends_on:
      - redis
    volumes:
      - ..:/app
    command: pnpm --filter @nodejs-kubernetes-microservices/job-worker dev

volumes:
  redis-data:
